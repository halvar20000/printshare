<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintShare</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --accent:#2f6fed; --ok:#1f8a4c; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1f1f1d; --fg:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#6b9bff; --ok:#4cc27f; --err:#ff6b5b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, button { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; margin-top:14px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; }
  .log { font:13px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; color:var(--muted); }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  details summary { cursor:pointer; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>PrintShare</h1>
  <div class="card">
    <label for="link">Printables / Thingiverse link</label>
    <input id="link" placeholder="https://www.printables.com/model/…" autocomplete="off">
    <button class="secondary" id="check">Check files</button>
    <label for="file">File</label>
    <select id="file"><option value="">(automatic)</option></select>
    <label for="printer">Printer</label>
    <select id="printer"></select>
    <div class="row">
      <button id="upload" class="secondary">Upload only</button>
      <button id="print">Print</button>
    </div>
  </div>
  <div class="card"><div id="out" class="log">Ready.</div></div>
  <div class="card"><div class="row"><button class="secondary" id="status">Printer status</button></div></div>
  <details class="card"><summary>Settings</summary>
    <label for="token">API token</label>
    <input id="token" type="password" autocomplete="off">
  </details>
</main>
<script>
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const qs = new URLSearchParams(location.search);
$("token").value = qs.get("token") || store.get("ps_token");
$("link").value = qs.get("link") || qs.get("url") || qs.get("text") || "";
$("token").onchange = () => store.set("ps_token", $("token").value);
if (qs.get("token")) store.set("ps_token", qs.get("token"));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    "Authorization": "Bearer " + $("token").value, ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ("HTTP " + r.status));
  return body;
}
const out = (text, cls = "") => { $("out").className = "log " + cls; $("out").textContent = text; };

async function loadPrinters() {
  try {
    const ps = await api("/api/printers");
    $("printer").innerHTML = ps.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
    const last = store.get("ps_printer"); if (last) $("printer").value = last;
  } catch (e) { out("Could not load printers: " + e.message + "\nSet the API token under Settings.", "err"); }
}
$("printer").onchange = () => store.set("ps_printer", $("printer").value);

$("check").onclick = async () => {
  out("Looking up files…");
  try {
    const files = await api("/api/files?link=" + encodeURIComponent($("link").value));
    $("file").innerHTML = '<option value="">(automatic)</option>' +
      files.map(f => `<option value="${f.index}">${f.name}</option>`).join("");
    out(files.length + " sliceable file(s) found.");
  } catch (e) { out(e.message, "err"); }
};

async function go(start) {
  $("print").disabled = $("upload").disabled = true;
  try {
    const { job } = await api("/api/print", { method: "POST", body: JSON.stringify({
      link: $("link").value, printer: $("printer").value, file: $("file").value || null, start }) });
    for (;;) {
      await new Promise(r => setTimeout(r, 1500));
      const j = await api("/api/jobs/" + job);
      const lines = j.log.join("\n");
      if (j.state === "done") {
        const r = j.result;
        out(lines + `\n\n✔ ${r.source_file}\n${r.print_time || "?"} · ${r.filament_g || "?"} g`, "ok"); break;
      }
      if (j.state === "error") { out(lines + "\n\n✘ " + j.error, "err"); break; }
      out(lines + "\n…");
    }
  } catch (e) { out(e.message, "err"); }
  $("print").disabled = $("upload").disabled = false;
}
$("print").onclick = () => go(true);
$("upload").onclick = () => go(false);

$("status").onclick = async () => {
  try {
    const s = await api(`/api/printers/${$("printer").value}/status`);
    out(`State: ${s.state ?? "?"}\nFile: ${s.file ?? "-"}\nProgress: ${s.progress ?? "-"} %\n` +
        `Layer: ${s.layer ?? "-"} / ${s.layers ?? "-"}\nNozzle: ${s.nozzle ?? "-"} / ${s.nozzle_target ?? "-"} °C\n` +
        `Bed: ${s.bed ?? "-"} / ${s.bed_target ?? "-"} °C`);
  } catch (e) { out(e.message, "err"); }
};
loadPrinters();
</script>
</body>
</html>
