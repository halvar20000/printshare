; PocketPrint3D NFC reader: ESP32 + PN5180 at the spool holder (docs/NFC-READER.md).
; Build: pio run -e esp32s3   (merged image for web flashing: scripts/build.sh)
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    atrappmann/PN5180 Library@1.5
    tzapu/WiFiManager@2.0.17

; ESP32-S3-DevKitC-1 (e.g. N16R8). SPI: SCK 12, MISO 13, MOSI 11, NSS 10, BUSY 9, RST 14
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DPN_SCK=12 -DPN_MISO=13 -DPN_MOSI=11 -DPN_NSS=10 -DPN_BUSY=9 -DPN_RST=14 -DARDUINO_USB_CDC_ON_BOOT=0

; classic ESP32 DevKit (WROOM-32). SPI: SCK 18, MISO 19, MOSI 23, NSS 5, BUSY 16, RST 17
[env:esp32]
board = esp32dev
build_flags = -DPN_SCK=18 -DPN_MISO=19 -DPN_MOSI=23 -DPN_NSS=5 -DPN_BUSY=16 -DPN_RST=17
