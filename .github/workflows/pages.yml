# Publishes the website in site/ to GitHub Pages (pocketprint3d.com).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions", custom domain pocketprint3d.com.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: No placeholders left in the imprint / privacy policy
        run: |
          if grep -rn "\[TODO" site; then
            echo "::error::site/ still contains [TODO ...] placeholders - fill them in before publishing"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
