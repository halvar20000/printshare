# Ready-made Raspberry Pi image for a printer camera (pi-image/stage-camera): Raspberry Pi OS Lite 64-bit + mediamtx,
# serving a Pi camera module (V2 / V3 / OV5647) as rtsp://<IP>:8554/cam for PocketPrint3D's "Own camera".
# Network cable, no setup, no default password, SSH off. Started by hand or by a tag pi-camera-v<version>.
name: Raspberry Pi camera image

on:
  workflow_dispatch:
  push:
    tags: ["pi-camera-v*"]

permissions:
  contents: write

env:
  MEDIAMTX: v1.21.1

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - name: mediamtx (checksum checked)
        run: |
          cd /tmp
          base="https://github.com/bluenviron/mediamtx/releases/download/$MEDIAMTX"
          curl -fsSLO "$base/mediamtx_${MEDIAMTX}_linux_arm64.tar.gz"
          curl -fsSLO "$base/checksums.sha256"
          grep "mediamtx_${MEDIAMTX}_linux_arm64.tar.gz" checksums.sha256 | sed 's/\*//' | sha256sum -c -
          tar xzf "mediamtx_${MEDIAMTX}_linux_arm64.tar.gz" mediamtx
          install -m 755 mediamtx "$GITHUB_WORKSPACE/pi-image/stage-camera/00-camera/files/mediamtx"
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: pocketprint3d-camera
          release: trixie
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./pi-image/stage-camera
          hostname: pocketprint3d-cam
          # an account without password (locked) and no SSH; the first-boot user wizard stays (pi-gen refuses to
          # switch it off without a password) - it only waits on a connected keyboard and doesn't hold up the camera
          username: pp3d
          password: ""
          enable-ssh: 0
          locale: en_US.UTF-8
          timezone: Etc/UTC
          keyboard-keymap: us
          keyboard-layout: English (US)
          compression: xz
          compression-level: 6
          # not on arm64: its apt purge names packages the arm runner image lacks → apt exits 100
          increase-runner-disk-size: false
          github-token: ${{ github.token }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pi-camera-v${{ steps.v.outputs.version }}"
          cp "${{ steps.build.outputs.image-path }}" pocketprint3d-camera-pi.img.xz
          sha256sum pocketprint3d-camera-pi.img.xz > pocketprint3d-camera-pi.img.xz.sha256
          notes="PocketPrint3D camera ${{ steps.v.outputs.version }} for the Raspberry Pi 3, 4, 5 (64-bit) with a camera module
          (V2, V3 or OV5647). Write it to an SD card with Raspberry Pi Imager (Use custom), connect the camera and a network
          cable, then power. In the PocketPrint3D app: printer settings → Own camera → rtsp://<IP of the Pi>:8554/cam"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Raspberry Pi camera image ${{ steps.v.outputs.version }}" --notes "$notes" --latest=false
          gh release upload "$tag" pocketprint3d-camera-pi.img.xz pocketprint3d-camera-pi.img.xz.sha256 --clobber
