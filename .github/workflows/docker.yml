# Tests, then builds the PocketPrint3D image for amd64 + arm64 on native runners and publishes
# ghcr.io/halvar20000/printshare with the tags :latest and :<version from pyproject.toml>.
# The Unraid template and the Home Assistant add-on install this image.
# Also the slim bridge image ghcr.io/halvar20000/printshare-bridge (Dockerfile.bridge, no OrcaSlicer, docs/BRIDGE.md).
name: Docker image

on:
  push:
    branches: [main]
    # mobile/ counts: the web app (app.pocketprint3d.com) is built from it into the image
    paths-ignore: ["mobile/README.md", "mobile/scripts/**", "docs/**", "homeassistant/**", "unraid/**", "site/**", "deploy/**", "dns/**", "pi-image/**", ".github/workflows/pi-image.yml", ".github/workflows/pi-camera-image.yml", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/halvar20000/printshare
  BRIDGE_IMAGE: ghcr.io/halvar20000/printshare-bridge

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # the fake Centauri printer listens on port 80 like the real one
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - run: pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            hass_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            hass_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            HASS_ARCH=${{ matrix.hass_arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.hass_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.hass_arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.hass_arch }}
          path: /tmp/digests/*
          retention-days: 1

  integration:
    # All tests again, inside the freshly built amd64 image - so the ones that need the real
    # OrcaSlicer (slicing, presets, multicolour) run too. Tags are only set when they pass.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests with the real OrcaSlicer
        run: |
          set -o pipefail
          digest=$(ls /tmp/digests)
          docker run --rm -v "$PWD:/src:ro" -w /src -e ORCA_ROOT=/opt/orca -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh "$IMAGE@sha256:$digest" -c \
            "pip install -q pytest aiohttp trimesh && python -m pytest -q -p no:cacheprovider -rfEs --tb=short tests" \
            | tee /tmp/pytest.log
      - name: Report failed tests as annotations
        # job logs need admin rights; annotations are public, so failures can be read without them
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          log = open("/tmp/pytest.log", encoding="utf-8", errors="replace").read()
          for line in re.findall(r"^(?:FAILED|ERROR) .*$", log, re.M)[:20]:
              print("::error title=test failed::" + line[:900].replace("%", "%25"))
          blocks = re.split(r"\n_{5,} (.+?) _{5,}\n", log)
          for name, body in list(zip(blocks[1::2], blocks[2::2]))[:10]:
              text = body.strip()[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name[:80]}::{text}")
          PY

  publish:
    needs: [build, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:${{ steps.v.outputs.version }}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"

  bridge:
    # the slim bridge image: built natively per architecture, checked, then tagged together
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest (untagged until the smoke test passed)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bridge
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          outputs: type=image,name=${{ env.BRIDGE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bridge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bridge-${{ matrix.arch }}
      - name: Smoke test - starts, answers, shows its bridge state
        run: |
          img="$BRIDGE_IMAGE@${{ steps.build.outputs.digest }}"
          c=pp3d-bridge-smoke
          fail() { echo "::error title=bridge smoke test::$1 | $(docker logs $c 2>&1 | tail -15 | tr '\n' '|')"; exit 1; }
          out=$(docker pull "$img" 2>&1) || fail "docker pull failed: $(echo "$out" | tail -3 | tr '\n' ' ')"
          out=$(docker run -d --name $c -p 8484:8484 -e PRINTSHARE_API_TOKEN=t -e PRINTSHARE_BRIDGE_URL=http://127.0.0.1:9 "$img" 2>&1) \
            || fail "docker run failed: $(echo "$out" | tail -3 | tr '\n' ' ')"
          for i in $(seq 40); do curl -sf -H "Authorization: Bearer t" localhost:8484/api/bridge >/dev/null && break; sleep 1; done
          out=$(curl -sf -H "Authorization: Bearer t" localhost:8484/api/bridge) || fail "no answer from /api/bridge"
          echo "$out"
          echo "$out" | grep -q '"enabled":true' || fail "bridge mode not on: $out"
          hello=$(curl -sf localhost:8484/api/bridge/hello) || fail "no answer from /api/bridge/hello"
          echo "$hello" | grep -q '"bridge_only":true' || fail "not a bridge-only install: $hello"
          docker logs $c | tail -20
          docker rm -f $c
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  bridge-publish:
    needs: bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: bridge-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$BRIDGE_IMAGE:latest" -t "$BRIDGE_IMAGE:${{ steps.v.outputs.version }}" \
            $(printf "$BRIDGE_IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$BRIDGE_IMAGE:latest"
