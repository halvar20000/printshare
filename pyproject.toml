[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printshare"
version = "0.9.0"
description = "Print Printables/Thingiverse models from your phone on non-Bambu printers (self-hosted)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pycentauri>=0.9",
  "segno>=1.6",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "trimesh>=4", "aiohttp>=3.9"]

[project.scripts]
printshare = "printshare.cli:main"

[tool.setuptools.packages.find]
include = ["printshare*"]

[tool.setuptools.package-data]
printshare = ["web/*.html", "web/*.js", "web/*.css", "web/*.webmanifest", "web/icons/*.png"]
