name: PocketPrint3D
version: "0.37.0"
slug: printshare
description: >-
  Print Printables and Thingiverse models from your phone. Slices with OrcaSlicer and sends the
  job to Elegoo Centauri Carbon, Klipper/Moonraker, Prusa (PrusaLink) or OctoPrint printers.
url: https://github.com/halvar20000/printshare
arch:
  - amd64
  - aarch64
image: ghcr.io/halvar20000/printshare
startup: application
boot: auto
ports:
  8484/tcp: 8484
webui: http://[HOST]:[PORT:8484]/
hassio_api: true
# issue #9: switch the printer's smart plug through Home Assistant without a token
homeassistant_api: true
map:
  - addon_config:rw
options:
  printers: []
  server_url: ""
  remote_url: ""
  api_token: ""
  thingiverse_token: ""
  cloud_bridge: false
  lan_subnet: ""
schema:
  printers:
    - name: str
      type: list(elegoo_sdcp|moonraker|prusalink|octoprint|bambu_lan)
      address: str
      cosmos: bool?
      api_key: password?
      password: password?
      printer_profile: str?
      quality_profile: str?
      filament_profile: str?
      build_plate: list(Textured PEI Plate|High Temp Plate|Cool Plate|Engineering Plate|Supertack Plate)?
  server_url: str?
  remote_url: str?
  api_token: password?
  thingiverse_token: password?
  cloud_bridge: bool?
  lan_subnet: str?
