configuration:
  printers:
    name: Drucker
    description: >-
      Ein Eintrag pro Drucker. type: elegoo_sdcp (Elegoo-Originalfirmware) oder moonraker (Klipper,
      z. B. OpenCentauri COSMOS). address: IP-Adresse des Druckers. cosmos: PRINT_START/PRINT_END
      verwenden (nur Klipper, Standard an). Profile sind OrcaSlicer-Presetnamen (Standard: Centauri Carbon, PLA).
  server_url:
    name: Server-Adresse für die App
    description: >-
      Adresse, die das Handy verwendet, z. B. http://192.168.1.5:8484. Leer = automatisch ermittelt.
      Wird im Protokoll als QR-Code angezeigt.
  api_token:
    name: Zugangs-Token
    description: Leer = wird einmalig erzeugt und im Protokoll angezeigt.
  thingiverse_token:
    name: Thingiverse-App-Token
    description: Nur für Thingiverse-Links nötig (thingiverse.com/developers).
network:
  8484/tcp: Web-App und API für die PrintShare-App
