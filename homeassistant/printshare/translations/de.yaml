configuration:
  printers:
    name: Drucker
    description: >-
      Ein Eintrag pro Drucker. type: elegoo_sdcp (Elegoo-Originalfirmware), moonraker (Klipper, z. B.
      OpenCentauri COSMOS), prusalink (Prusa MK4/CORE One/MINI/XL; Passwort vom Druckerdisplay) oder
      octoprint (api_key) oder bambu_lan (Bambu Lab im LAN-Modus mit Developer Mode; password = Access Code).
      address: IP-Adresse des Druckers. printer_profile: OrcaSlicer-Druckername, Pflicht bei
      prusalink/octoprint/bambu_lan (z. B. Prusa MK4S 0.4 nozzle); Standard Centauri Carbon.
  server_url:
    name: Server-Adresse für die App
    description: >-
      Adresse, die das Handy verwendet, z. B. http://192.168.1.5:8484. Leer = automatisch ermittelt.
      Wird im Protokoll als QR-Code angezeigt.
  remote_url:
    name: Adresse unterwegs
    description: >-
      Optional, z. B. deine Tailscale-Adresse http://100.x.y.z:8484. Die App probiert zuerst die
      Adresse zu Hause und wechselt automatisch. Steht mit im QR-Code.
  api_token:
    name: Zugangs-Token
    description: Leer = wird einmalig erzeugt und im Protokoll angezeigt.
  thingiverse_token:
    name: Thingiverse-App-Token
    description: Nur für Thingiverse-Links nötig (thingiverse.com/developers).
  cloud_bridge:
    name: Mit PocketPrint3D Cloud verbinden
    description: >-
      Brückenmodus: Die PocketPrint3D-App erreicht diese Drucker von überall über dein kostenloses
      PocketPrint3D-Cloud-Konto (nur ausgehende Verbindung). Protokoll und Webseite zeigen einen Code – gib ihn in der
      App ein (Einstellungen > Erweitert > Unterwegs drucken).
  lan_subnet:
    name: Heimnetz für die Druckersuche
    description: Optional, Brückenmodus, z. B. 192.168.1.0/24 – damit die App über die Brücke Drucker suchen kann.
network:
  8484/tcp: Web-App und API für die PocketPrint3D-App
