configuration:
  printers:
    name: Printers
    description: >-
      One entry per printer. type: elegoo_sdcp (Elegoo stock firmware), moonraker (Klipper, e.g.
      OpenCentauri COSMOS), prusalink (Prusa MK4/CORE One/MINI/XL; password from the printer screen)
      or octoprint (api_key). address: IP of the printer. printer_profile: OrcaSlicer printer name,
      required for prusalink/octoprint (e.g. Prusa MK4S 0.4 nozzle); default Centauri Carbon.
  server_url:
    name: Server address for the app
    description: >-
      Address the phone uses, e.g. http://192.168.1.5:8484. Empty = detected automatically.
      Shown as QR code in the log.
  remote_url:
    name: Address away from home
    description: >-
      Optional, e.g. your Tailscale address http://100.x.y.z:8484. The app tries the home address
      first and switches automatically. Included in the QR code.
  api_token:
    name: Access token
    description: Empty = generated once and shown in the log.
  thingiverse_token:
    name: Thingiverse app token
    description: Only needed for Thingiverse links (thingiverse.com/developers).
  cloud_bridge:
    name: Connect to PocketPrint3D Cloud
    description: >-
      Bridge mode: the PocketPrint3D app reaches these printers from anywhere through your free PocketPrint3D Cloud
      account (outgoing connection only). The log and the web page show a pairing code - enter it in the app
      (Settings > Advanced > Print from anywhere).
  lan_subnet:
    name: Home network for the printer search
    description: Optional, bridge mode, e.g. 192.168.1.0/24 - lets the app search printers through the bridge.
network:
  8484/tcp: Web app and API for the PocketPrint3D app
